<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saree Shop - As Seen on Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./">Saree Shop</a>
    <a class="link" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Saw it in a reel? The link is right here</h1>
    <p>Every saree I wear on Instagram is listed here. Found one you love? Shop it directly.</p>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  <div class="grid" id="grid" aria-live="polite"><p class="msg">Loading sarees...</p></div>
</main>

<footer>
  <div class="wrap">I may earn a small commission when you buy through these links. It does not change the price you pay.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const grid = document.getElementById("grid");
const chips = document.getElementById("chips");
let all = [], active = "All";

function showMsg(t){ grid.innerHTML=""; const p=document.createElement("p"); p.className="msg"; p.textContent=t; grid.appendChild(p); }

function renderChips(){
  const cats = [...new Set(all.map(p => (p.category||"").trim()).filter(Boolean))];
  chips.innerHTML = "";
  if (!cats.length) return;
  ["All", ...cats].forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c;
    b.setAttribute("aria-pressed", c === active);
    b.onclick = () => { active = c; renderChips(); renderGrid(); };
    chips.appendChild(b);
  });
}

function renderGrid(){
  const list = active === "All" ? all : all.filter(p => (p.category||"").trim() === active);
  if (!list.length) return showMsg("No sarees yet.");
  grid.innerHTML = "";
  list.forEach(p => {
    const card = document.createElement("article"); card.className = "card";
    const ph = document.createElement("div"); ph.className = "ph";
    const img = document.createElement("img");
    img.src = safeUrl(p.image_url); img.alt = p.name; img.loading = "lazy";
    ph.appendChild(img);
    const info = document.createElement("div"); info.className = "info";
    const h = document.createElement("h3"); h.textContent = p.name;
    info.appendChild(h);
    if (p.price != null) {
      const pr = document.createElement("div"); pr.className = "price";
      pr.textContent = "₹" + Number(p.price).toLocaleString("en-IN");
      info.appendChild(pr);
    }
    const buy = document.createElement("div"); buy.className = "buy";
    const a = document.createElement("a"); a.className = "btn"; a.textContent = "Shop now";
    a.href = safeUrl(p.affiliate_link); a.target = "_blank"; a.rel = "noopener noreferrer sponsored";
    buy.appendChild(a); info.appendChild(buy);
    card.append(ph, info); grid.appendChild(card);
  });
}

(async () => {
  const { data, error } = await db.from("products").select("*").order("created_at", { ascending:false });
  if (error) { console.error(error); return showMsg("Could not load sarees. Please try again in a moment."); }
  all = data || [];
  renderChips(); renderGrid();
})();
</script>
</body>
</html>
