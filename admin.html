<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Add New Saree</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-form-container {
      max-width: 500px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .submit-btn {
      width: 100%;
      background: #111;
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:disabled {
      background: #888;
      cursor: not-allowed;
    }
    #statusMsg {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="container nav">
    <div class="logo">SAREE SHOP - ADMIN</div>
    <nav>
      <a href="index.html">View Shop</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="admin-form-container">
    <h2>Add New Saree</h2>
    <br>
    <form id="addSareeForm">
      <div class="form-group">
        <label for="sareeName">Saree Name</label>
        <input type="text" id="sareeName" required placeholder="e.g. Banarasi Silk Saree">
      </div>

      <div class="form-group">
        <label for="sareePrice">Price (₹)</label>
        <input type="number" id="sareePrice" required placeholder="e.g. 1499">
      </div>

      <div class="form-group">
        <label for="sareeImage">Select Saree Image</label>
        <input type="file" id="sareeImage" accept="image/*" required>
      </div>

      <div class="form-group">
        <label for="affiliateLink">Instagram / Buy Link</label>
        <input type="url" id="affiliateLink" required placeholder="https://instagram.com/...">
      </div>

      <div class="form-group">
        <label for="sareeCategory">Category</label>
        <input type="text" id="sareeCategory" placeholder="e.g. Silk, Cotton, Party Wear">
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Upload & Add Saree</button>
      <p id="statusMsg"></p>
    </form>
  </div>
</div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://amccedlicdnyulaesqdw.supabase.co";
  const SUPABASE_KEY = "Sb_publishable_CYRf_kgkkeGsJLFZgO9Djw_7Fq2GoHc";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById("addSareeForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("statusMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("sareeName").value.trim();
    const price = document.getElementById("sareePrice").value.trim();
    const link = document.getElementById("affiliateLink").value.trim();
    const category = document.getElementById("sareeCategory").value.trim();
    const fileInput = document.getElementById("sareeImage");
    const file = fileInput.files[0];

    if (!file) {
      alert("कृपया एक इमेज चुनें!");
      return;
    }

    try {
      submitBtn.disabled = true;
      statusMsg.style.color = "#333";
      statusMsg.innerText = "Uploading image...";

      // 1. Image को Supabase Storage ('saree-images') में अपलोड करें
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const filePath = `${fileName}`;

      const { data: uploadData, error: uploadError } = await supabaseClient
        .storage
        .from('saree-images')
        .upload(filePath, file);

      if (uploadError) throw uploadError;

      // 2. Uploaded image का Public URL लें
      const { data: publicUrlData } = supabaseClient
        .storage
        .from('saree-images')
        .getPublicUrl(filePath);

      const imageUrl = publicUrlData.publicUrl;

      statusMsg.innerText = "Saving saree details...";

      // 3. Products टेबल में डेटा इन्सर्ट करें
      const { error: insertError } = await supabaseClient
        .from('products')
        .insert([
          {
            name: name,
            price: parseFloat(price),
            image_url: imageUrl,
            affiliate_link: link,
            category: category
          }
        ]);

      if (insertError) throw insertError;

      statusMsg.style.color = "green";
      statusMsg.innerText = "सफलतापूर्वक अपलोड हो गया!";
      form.reset();

    } catch (err) {
      console.error(err);
      statusMsg.style.color = "red";
      statusMsg.innerText = "Error: " + (err.message || "कुछ गड़बड़ हो गई");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
